<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coworking Space Booking Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>Coworking Space Booking</h1>
        <form id="bookingForm">
            <div class="form-group">
                <label for="product">Product Type</label>
                <select id="product" name="product" required>
                    <option value="" style="color: #999;">Select Product</option>
                    <option value="meeting_room">Meeting Room</option>
                    <option value="day_pass">Day Pass</option>
                </select>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <select id="city" name="city" required>
                    <option value="" style="color: #999;">Select City</option>
                    <option value="Ahmedabad">Ahmedabad</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="gurugram">Gurugram</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Noida">Noida</option>
                    <option value="Pune">Pune</option>
                </select>
            </div>

            <!--    <div class="form-group">
                <label for="localities">Localities</label>
               <input type="text" id="localities" name="localities" placeholder="Enter localities"> 
                <select id="localities" name="localities" required>
                    <option value="">Select a locality</option>
                </select>
            </div>-->
            <div class="form-group">
                <label>Localities</label>
                <div class="checkbox-group" id="localitiesGroup">
                    <div class="checkbox-item select-all-item">
                        <label>
                            <input type="checkbox" id="selectAllLocalities"> Select All
                        </label>
                    </div>
                    <!-- Localities will be appended here dynamically -->
                </div>
            </div>


            <div class="form-group">
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" name="capacity" min="1" required placeholder="Enter capacity">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <div class="date-picker-container">
                    <input type="text" id="date" name="date" placeholder="Select date" required>
                    <i class="fas fa-calendar-alt"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="duration">Duration (hours)</label>
                <input type="number" id="duration" name="duration" min="1" max="12" required
                    placeholder="Enter duration">
            </div>

            <div class="form-group">
                <label for="timeSlot">Time Slot</label>
                <select id="timeSlot" name="timeSlot" required>
                    <option value="" style="color: #999;">Select Time Slot</option>
                    <option value="FULL_DAY">Full Day</option>
                    <option value="MORNING">Morning (before 12 noon)</option>
                    <option value="AFTERNOON">Afternoon (12 noon to 4 pm)</option>
                    <option value="EVENING">Evening (after 4 pm)</option>
                </select>
            </div>


            <div class="form-group">
                <label for="sortBy">Sort By</label>
                <select id="sortBy" name="sortBy">
                    <option value="popularity">Popularity</option>
                    <option value="distance">Distance (from city center)</option>
                    <option value="price_low_high">Price (L-H)</option>
                    <option value="price_high_low">Price (H-L)</option>
                    <option value="capacity_low_high">Capacity (L-H)</option>
                    <option value="capacity_high_low">Capacity (H-L)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="priceRange">Price Range (₹)</label>
                <input type="range" id="priceRange" min="0" max="50000" value="50000" step="100">
                <div class="price-value">₹<span id="priceValue">50000</span></div>
            </div>


            <div class="form-group">
                <label>Brands</label>
                <div class="checkbox-group" id="brandsGroup">
                    <div class="checkbox-item select-all-item">
                        <label>
                            <input type="checkbox" id="selectAllBrands"> Select All
                        </label>
                    </div>

                    <!-- Existing entries (if needed, can remove duplicates below) -->
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="wework">
                            WeWork</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="awfis"> AWFIS</label>
                    </div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="cowrks">
                            CoWrks</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="innov8">
                            Innov8</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="91springboard">
                            91Springboard</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="evolve-work-studio">
                            Evolve Work Studio</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="indiqube">
                            IndiQube</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="smartworks">
                            Smartworks</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="capsule-works">
                            Capsule Works</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="alt-f-coworking"> Alt
                            F Coworking</label></div>

                    <!-- New entries -->
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="apna-office"> Apna
                            Office</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands"
                                value="apeejay-business-center"> Apeejay Business Center</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="blue-lotus-workadda">
                            Blue Lotus WorkAdda</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="bootstart">
                            Bootstart</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="esziworkn">
                            EsziWorkN</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="garage-coworking">
                            Garage Coworking</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="india-accelerator">
                            India Accelerator</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="iksana-workspaces">
                            Iksana Workspaces</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="lets-work"> Lets
                            Work</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="lumos-cowork"> Lumos
                            Cowork</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="martini-spaces">
                            Martini Spaces</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="miqb"> MiQB</label>
                    </div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="ofis-square"> Ofis
                            Square</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="rands"> Rands</label>
                    </div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="spacetime">
                            Spacetime</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="springhouse">
                            SpringHouse</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="sspacia">
                            Sspacia</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="table-space"> Table
                            Space</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="the-business-quater">
                            The Business Quater</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="the-circle-work"> The
                            Circle.Work</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="the-playce"> The
                            Playce</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="tick"> Tick</label>
                    </div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="toutle-space"> Toutle
                            Space</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="triggerxchange">
                            TriggerXchange</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="trios"> Trios</label>
                    </div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="urban-cabin-cowork">
                            Urban Cabin Cowork</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="urbanwrk">
                            UrbanWrk</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="wegrow">
                            WeGrow</label></div>
                    <div class="checkbox-item"><label><input type="checkbox" name="brands" value="wings-space"> Wings
                            Space</label></div>
                </div>
            </div>


            <div class="form-group">
                <label>Equipments</label>
                <div class="checkbox-group" id="equipmentsGroup">
                    <div class="checkbox-item select-all-item">
                        <label>
                            <input type="checkbox" id="selectAllEquipments"> Select All
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="equipments" value="MONITOR_TV_PROJECTOR"> Monitor/TV/Projector
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="equipments" value="SPEAKERS"> Speakers
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="equipments" value="VIDEO_CONFERENCE"> Video Conference
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="equipments" value="WHITEBOARD"> Whiteboard
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Amenities</label>
                <div class="checkbox-group" id="amenitiesGroup">
                    <div class="checkbox-item select-all-item">
                        <label>
                            <input type="checkbox" id="selectAllAmenities"> Select All
                        </label>
                    </div>
                    <div class="checkbox-item select-all-items">
                        <label>
                            <input type="checkbox" name="amenities" value="parking"> Parking (2/4 Wheeler)
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="amenities" value="beverages"> Beverages (Tea/Coffee/Water)
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="amenities" value="electricity"> Electricity (Charging, Power
                            Backup)
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <label>
                            <input type="checkbox" name="amenities" value="stationery"> Stationery
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="receiverEmail">Receiver Email</label>
                <input type="email" id="receiverEmail" name="receiverEmail" required placeholder="Enter receiver email">
                <div class="error" id="receiverEmailError">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="ccEmail">CC Email</label>
                <input type="email" id="ccEmail" name="ccEmail" placeholder="Enter CC email (optional)">
                <div class="error" id="ccEmailError">Please enter a valid email address</div>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js">
    </script>
</body>

</html>
